<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خدماتي</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5fa;color:#18304d;font-family:Arial}
header{background:#123b70;color:white;padding:25px;border-radius:0 0 25px 25px}
header h1{margin:0}
h2{padding:0 15px}
.services{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:15px}
.service{background:white;padding:20px 8px;text-align:center;border-radius:15px;box-shadow:0 3px 12px #0001}
.service span{font-size:34px}
.service h3{font-size:16px}
.banner{margin:15px;background:#dceaff;padding:20px;border-radius:15px}
button{background:#1765bd;color:white;border:0;padding:13px;border-radius:10px;font-size:16px;width:100%}
.service button{margin-top:8px}
</style>
</head>
<body>
<header>
<h1>⚡ خدماتي</h1>
<p>كل خدمات منزلك في تطبيق واحد</p>
</header>
<h2>خدماتنا المنزلية</h2>
<div class="services">
<div class="service"><span>⚡</span><h3>الكهرباء</h3><button onclick="bookService('الكهرباء')">احجز الآن</button></div>
<div class="service"><span>🚰</span><h3>السباكة</h3><button onclick="bookService('السباكة')">احجز الآن</button></div>
<div class="service"><span>❄️</span><h3>التكييف والتبريد</h3><button onclick="bookService('التكييف والتبريد')">احجز الآن</button></div>
<div class="service"><span>🪚</span><h3>النجارة</h3><button onclick="bookService('النجارة')">احجز الآن</button></div>
<div class="service"><span>🎨</span><h3>النقاشة والدهانات</h3><button onclick="bookService('النقاشة والدهانات')">احجز الآن</button></div>
<div class="service"><span>🔥</span><h3>الغاز</h3><button onclick="bookService('الغاز')">احجز الآن</button></div>
<div class="service"><span>🧹</span><h3>التنظيف</h3><button onclick="bookService('التنظيف')">احجز الآن</button></div>
<div class="service"><span>🏠</span><h3>خدمات أخرى</h3><button onclick="bookService('خدمات أخرى')">احجز الآن</button></div>
</div>
<div class="banner">
<h3>محتاج فني لمنزلك؟</h3>
<p>احجز الخدمة المناسبة بسهولة.</p>
</div>
<script src="app.js"></script>
</body>
</html>
